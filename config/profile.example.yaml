  first_name: Jean
  last_name: DUPONT
  email: jean.dupont@example.com
  phone: "+33 6 12 34 56 78"
  city: Metz
  postal_code: "57000"
  country: France
  linkedin: https://www.linkedin.com/in/jean-dupont-exemple   # optionnel
  github: https://github.com/jean-dupont-exemple               # optionnel
  portfolio: https://jean-dupont.example.com                   # optionnel
  driving_license: "Permis B — véhicule personnel"             # optionnel

# --- Titre affiché sous ton nom sur le CV
headline: "Développeur Full-Stack Web & Logiciel — Alternance Bac+5 (24 mois) dès octobre 2026"

# --- Résumé de profil (3 à 5 phrases) : ton parcours, ce que tu cherches, ce que tu as déjà livré
summary: >-
  Diplômé du BUT Informatique (IUT Exemple, juin 2026 — RNCP niveau 6 / Bac+3), je recherche un contrat
  d'alternance de 24 mois à partir d'octobre 2026 (3 semaines en entreprise / 1 semaine en formation) pour préparer
  le titre Expert en ingénierie du développement et en architecture logicielle (Bac+5, RNCP 36469) à Exemple Digital
  School, avec un intérêt fort pour l'IA appliquée. J'ai déjà mené un cycle projet complet en entreprise —
  analyse des besoins, spécifications, développement, mise en production, documentation et support — sur une
  application intranet conçue seul et utilisée quotidiennement, ainsi que le développement en équipe d'un logiciel
  de gestion métier .NET.

# --- Ce que tu cherches : sert à collecter et à trier les offres
target:
  contract_types: [alternance, cdi]   # alternance | cdi | cdd | stage | interim | freelance
  job_titles:                         # intitulés recherchés (mots-clés des recherches)
    - développeur full-stack
    - développeur web
    - développeur logiciel
    - développeur fullstack alternance
    - concepteur développeur d'applications
    - développeur React
    - développeur Next.js
    - développeur .NET
    - développeur Python
    - développeur IA
  keywords: [TypeScript, React, Next.js, Node.js, C#, .NET, Python, PostgreSQL]
  # Zones de recherche : ville + rayon en km (latitude/longitude pour le calcul des distances).
  # contract_types sur une zone = contrats acceptés uniquement dans cette zone.
  locations:
    - {city: Metz, postal_code: "57000", radius_km: 40, latitude: 49.1193, longitude: 6.1757}
    - {city: Nancy, postal_code: "54000", radius_km: 25, latitude: 48.6921, longitude: 6.1844}
    - city: Luxembourg
      postal_code: ''
      radius_km: 25
      latitude: 49.6116
      longitude: 6.1319
      country: LU
      contract_types:
        - cdi
  remote_ok: true
  # Offres écartées si l'intitulé contient l'un de ces mots
  exclude_title_keywords:
    - senior
    - sénior
    - lead
    - tech lead
    - principal
    - staff engineer
    - manager
    - head of
    - directeur
    - directrice
    - responsable
    - expert
    - confirmé
    - "5 ans"
  # Offres écartées si la description contient l'une de ces expressions
  exclude_description_keywords:
    - "5 ans d'expérience minimum"
    - "7 ans d'expérience"
    - "10 ans d'expérience"
    - habilitation secret défense
  exclude_companies: []       # entreprises à ne jamais contacter
  max_experience_years: 2     # expérience maximale exigée par une offre
  min_salary_eur:             # vide = pas de minimum
  # Candidatures spontanées : codes NAF (INSEE) et départements des entreprises ciblées
  naf_codes: ["62.01Z", "62.02A", "62.03Z", "62.09Z", "63.11Z", "63.12Z", "58.29A", "58.29B", "58.29C", "58.21Z", "73.11Z"]
  departments: ["57", "54"]
  min_headcount_code: "02"  # tranche d'effectif INSEE minimale : 02 = 3 à 5 salariés (il faut un tuteur)

# --- Alternance : l'école et le diplôme préparés (supprime la section si tu ne cherches pas d'alternance)
alternance:
  school: Exemple Digital School
  degree: "Expert en ingénierie du développement et en architecture logicielle (Bac+5, RNCP 36469)"
  rncp_level: "7"
  duration_months: 24
  start_date: "2026-10"
  rhythm: "3 semaines en entreprise / 1 semaine en formation"
  school_url: https://digital-school.example.com

