<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Full-Stack Developer at Acme</title></head>
<!-- Greenhouse embedded form (job-boards.greenhouse.io/embed/job_app), served inside an iframe of the
     company careers page (field names from the boards-api `questions` sample in the research). -->
<body>
<form id="application-form">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone">
  <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
  <label for="question_59674544">LinkedIn Profile</label><input id="question_59674544" name="question_59674544">
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
