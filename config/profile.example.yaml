# Profil maître — MODÈLE FICTIF à remplacer par tes propres informations.
#
# Mise en route :
#   1. copie ce fichier en config/profile.yaml (« jobbot init » le fait pour toi s'il n'existe pas) ;
#   2. remplace TOUT le contenu fictif (Jean DUPONT, ACME INDUSTRIE…) par tes vraies informations,
#      à la main ou en partant de ton CV : jobbot import-cv mon_cv.pdf (puis relis le résultat).
#
# config/profile.yaml est ignoré par git : tes données personnelles ne sont jamais publiées.
# C'est la SOURCE DE VÉRITÉ : les CV et lettres générés ne peuvent contenir QUE des éléments présents ici
# (reformulés, réordonnés, mis en avant). Plus il est riche, meilleur est le ciblage.

# --- Identité et coordonnées (en-tête du CV, formulaires de candidature, signature des e-mails)
