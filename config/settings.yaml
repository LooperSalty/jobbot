# Réglages jobbot — toutes les clés sont optionnelles (valeurs par défaut dans src/jobbot/config.py).

# auto   : candidature automatique si score ≥ thresholds.auto_apply_min_score, sinon file "à valider"
# review : tout passe par la file "à valider" du dashboard
mode: auto

headless: false          # navigateur visible pour LinkedIn/HelloWork (plus sûr, tu peux regarder)
browser_channel: chrome  # utilise ton Chrome installé ; null = Chromium de Playwright

llm:
  provider: claude_cli   # claude_cli (ton abonnement Claude Code) | anthropic (clé API) | none
  model: claude-sonnet-5
  fast_model: claude-haiku-4-5-20251001
  timeout_s: 240

limits:                  # quotas journaliers prudents (LinkedIn bannit les comptes trop actifs)
  linkedin_per_day: 15
  hellowork_per_day: 10
  lba_per_day: 30          # offres LBA + candidatures relayées par La Bonne Alternance (pas depuis ton Gmail)
  email_applications_per_day: 30
  spontaneous_per_day: 20  # utilisé seulement si la montée progressive ci-dessous est désactivée
  spontaneous_ramp:        # spontanées : 20/jour, +10 par semaine depuis le premier envoi réel, 50 au plus ;
    enabled: true          # retour à 20 (et notification) si plus de 5 % de rebonds sur 7 jours
    start: 20
    step_per_week: 10
    max: 50
    max_bounce_rate: 0.05
  followups_per_day: 10
  prepare_per_run: 25      # offres qui reçoivent CV + lettre par exécution (celles envoyées par jobbot d'abord)
  min_delay_s: 40
  max_delay_s: 140

thresholds:
  min_match_score: 45      # en dessous : offre écartée
  auto_apply_min_score: 60 # au-dessus (mode auto) : candidature sans validation
  target_ats_score: 80     # le CV est réécrit jusqu'à atteindre ce score (sans rien inventer)
  max_tailor_iterations: 3

followup:
  first_after_days: 7
  second_after_days: 8
  max_followups: 2
  give_up_after_days: 30

search:
  sources: [lba, france_travail, linkedin, hellowork, indeed, wttj, free_work, apec, adzuna, jooble, company_ats]
  max_results_per_query: 100
  max_age_days: 30
  max_detail_fetches_per_run: 60  # annonces courtes complétées (page de l'offre) avant la notation, par exécution
  max_ats_boards_per_run: 80      # pages carrières d'entreprises (Lever, Greenhouse, Teamtailor…) lues par exécution

night:                     # « jobbot night » (0 h 30) : entreprises + adresses + dossiers du lendemain, rien n'est envoyé
  until: "06:30"           # arrêt propre à cette heure (ou jobbot night --budget MINUTES)
  extra_radius_km: 20      # ajouté au rayon de chaque zone (50 km au plus)
  workers: 4               # recherches de contacts en parallèle (jamais deux à la fois sur le même site)
  max_llm_summaries: 80    # résumés de sites par le modèle rapide, par nuit
  prepare_margin: 5        # dossiers préparés pour le lendemain : plafond du jour + cette marge
  retention_days: 365      # contacts nominatifs des entreprises jamais contactées supprimés après ce délai
  search_min_interval_s: 6 # SearXNG : écart minimum entre deux requêtes (jour et nuit)
  max_search_queries: 300  # SearXNG : requêtes par jour
  search_backoff_hours: 6  # SearXNG laissé tranquille après un CAPTCHA / blocage de ses moteurs
  max_siren_lookups: 200   # recherches au registre par nuit pour identifier les employeurs des offres
  max_brave_queries: 900   # Brave Search (si BRAVE_API_KEY) : requêtes par mois, facturées au-delà du crédit offert

search_engine_engines: [bing]  # moteurs demandés à SearXNG (search_engine_url : settings.local.yaml du serveur)

notify_jarvis: false     # annonce vocale des réponses/entretiens via Jarvis
jarvis_script:           # chemin de ton jarvis_notify.py, ex. "C:/chemin/vers/jarvis_notify.py" (vide = désactivé)
setup_date: '2026-09-24'
