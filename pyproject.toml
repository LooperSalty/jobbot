[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jobbot"
version = "0.1.0"
description = "Automatisation de recherche d'emploi / alternance : collecte d'offres, CV & lettres ciblés avec score ATS, candidatures, relances, candidatures spontanées."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "playwright>=1.45",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "dnspython>=2.6",
  "rapidfuzz>=3.9",
  "python-docx>=1.1",
  "pypdf>=4.3",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "openpyxl>=3.1",
  "tzdata>=2024.1",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "pandas>=2.2"]
# python-jobspy pins pandas<3 / numpy<2: install it in a separate venv (.venv-jobspy), see README
jobspy = ["python-jobspy>=1.1"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "respx>=0.21"]

[project.scripts]
jobbot = "jobbot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
markers = [
  "live: hits real external services (skipped by default, run with -m live)",
  "browser: needs a Playwright browser",
]

[tool.coverage.run]
source = ["src/jobbot"]
omit = ["src/jobbot/dashboard/*"]
concurrency = ["greenlet", "thread"]
