<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Candidature — Acme Logiciels</title></head>
<!-- Application form opened in a new tab by the careers page ("newtab" scenario). -->
<body>
<h1>Postuler : Développeur Full-Stack en alternance</h1>
<form id="application">
  <div class="form-group"><span>Prénom</span><input name="firstname" required></div>
  <div class="form-group"><span>Nom de famille</span><input name="lastname" required></div>
  <div class="form-group"><span>E-mail</span><input name="email_address" type="email" required></div>
  <div class="form-group"><span>Déposez votre CV</span><input name="resume_file" type="file" accept=".docx,.doc"></div>
  <div class="form-group"><span>Photo (facultatif)</span><input name="photo" type="file" accept=".jpg,.png"></div>
  <button type="submit">Envoyer</button>
</form>
<script>
document.getElementById('application').addEventListener('submit', (e) => {
  e.preventDefault();
  fetch('/__test/submit', {method: 'POST', body: '{}'});
});
</script>
</body>
</html>
